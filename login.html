<!DOCTYPE html>
<html lang="en" class="h-full bg-[#eae4d8]">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login | The Artician Park</title>

    <!-- Google Fonts (Playfair Display & Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="preload" as="style" href="/build/assets/app-CJf5TaD9.css" /><link rel="modulepreload" as="script" href="/build/assets/app-DMsN-rLE.js" /><link rel="stylesheet" href="/build/assets/app-CJf5TaD9.css" /><script type="module" src="/build/assets/app-DMsN-rLE.js"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #eae4d8;
            color: #000000;
        }
        .font-serif-title {
            font-family: 'Playfair Display', Georgia, serif;
        }

        /* Prevent ugly browser autofill tint while enforcing black text */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 1000px #eae4d8 inset !important;
            -webkit-text-fill-color: #000000 !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="/images/artisan-logo.png">
</head>
<body class="min-h-full flex items-center justify-center p-4 sm:p-6 selection:bg-[#566b5e] selection:text-[#eae4d8]">

    <div class="w-full max-w-md py-6 sm:py-8">
        
        <!-- Brand Header (Primary #566b5e icon, Secondary #eae4d8, Black text) -->
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center gap-2.5 group">
                <img src="/images/artisan-logo.png" alt="ArtisanPark" class="w-14 h-14 rounded-full object-contain shadow-lg transition transform group-hover:scale-105">
                <div class="flex flex-col text-left">
                    <span class="text-2xl font-black tracking-widest text-black uppercase font-serif-title leading-none">ARTICIAN</span>
                    <span class="text-[9px] tracking-[0.25em] text-black/80 uppercase font-bold">PARK CONTROL PANEL</span>
                </div>
            </a>
            <h1 class="text-xl font-black text-black mt-5 uppercase tracking-wide">Administrator Portal</h1>
            <p class="text-xs text-black/80 mt-1 font-medium">Sign in to manage homepage hero sliders, categories & catalog products.</p>
        </div>

        <!-- Alert Notifications -->
        
        
        
        <!-- Login Card (Secondary #eae4d8 canvas, Primary #566b5e borders, Black text) -->
        <div class="bg-[#eae4d8] border-2 border-[#566b5e] shadow-xl p-8 sm:p-10 relative">
            <form action="admin-dashboard.html" onsubmit="event.preventDefault(); window.location.href='admin-dashboard.html';" method="POST" class="space-y-5">
                <input type="hidden" name="_token" value="LncYIXFiyT97ZWpasxY9j4Au9YvT8vxIqaxbVTTJ" autocomplete="off">
                <div>
                    <label for="email" class="block text-xs font-black uppercase tracking-wider text-black mb-2">
                        Email Address
                    </label>
                    <input type="email" 
                           id="email" 
                           name="email" 
                           value="admin@thearticianpark.com" 
                           required 
                           autofocus
                           placeholder="admin@thearticianpark.com"
                           class="w-full px-4 py-3 bg-[#eae4d8] border border-[#566b5e]/50 text-sm text-black font-semibold placeholder-black/40 focus:outline-hidden focus:border-[#566b5e] focus:ring-2 focus:ring-[#566b5e]/20 transition">
                </div>

                <div>
                    <label for="password" class="block text-xs font-black uppercase tracking-wider text-black mb-2">
                        Password
                    </label>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           value="password"
                           required 
                           placeholder="••••••••"
                           class="w-full px-4 py-3 bg-[#eae4d8] border border-[#566b5e]/50 text-sm text-black font-semibold placeholder-black/40 focus:outline-hidden focus:border-[#566b5e] focus:ring-2 focus:ring-[#566b5e]/20 transition">
                </div>

                <div class="flex items-center justify-between text-xs pt-1">
                    <label class="flex items-center gap-2 cursor-pointer text-black font-medium">
                        <input type="checkbox" name="remember" class="border border-[#566b5e]/50 text-[#566b5e] focus:ring-[#566b5e] bg-[#eae4d8]">
                        <span>Remember credentials</span>
                    </label>
                    <span class="text-black/80 font-semibold">Role: Superadmin</span>
                </div>

                <div class="pt-3">
                    <button type="submit" 
                            class="w-full py-3.5 px-6 rounded-full bg-[#566b5e] hover:bg-[#47594e] text-[#eae4d8] font-black text-xs uppercase tracking-widest transition transform hover:-translate-y-0.5 shadow-md flex items-center justify-center gap-2 cursor-pointer">
                        <svg class="w-4 h-4 text-[#eae4d8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                        </svg>
                        Log In to Control Panel
                    </button>
                </div>
            </form>

            <!-- Quick Demo Credentials Box -->
            <div class="mt-8 pt-6 border-t border-[#566b5e]/20 -mx-8 -mb-8 sm:-mx-10 sm:-mb-10 p-6 text-center bg-[#eae4d8]">
                <span class="text-[10px] font-black uppercase tracking-widest text-black/80 block mb-1">Default Admin Access</span>
                <p class="text-xs text-black font-mono font-bold">
                    admin@thearticianpark.com &bull; password
                </p>
                <div class="mt-3">
                    <a href="index.html" class="text-xs font-bold text-black hover:text-[#566b5e] hover:underline inline-flex items-center gap-1 transition">
                        &larr; Return to Storefront
                    </a>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
